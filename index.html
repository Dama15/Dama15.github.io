<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-BIT ORBIT | Pixel Art Presentation Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&family=Tektur:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-pink: #F0A6CA;
      --neon-cyan: #5EDCF4;
      --neon-yellow: #F4D03F;
      --deep-navy: #0F1B3D;
      --dark-void: #0A0E27;
      --soft-lavender: #E2D5F2;
      --pixel-size: 4px;
      --font-display: 'Tektur', cursive;
      --font-body: 'Chakra Petch', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      font-family: var(--font-body);
      color: var(--dark-void);
      background: var(--dark-void);
    }

    /* Deck now scrolls normally instead of snapping/transforming */
    .deck {
      width: 100%;
      cursor: crosshair;
    }

    .slides-container {
      width: 100%;
    }

    .slide {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3vh 2vw;
      scroll-margin-top: 0;
    }

    .slide:not(:first-child) {
      min-height: auto;
      justify-content: flex-start;
    }

    .slide:nth-child(2) {
      padding-bottom: 0;
    }

    .slide:nth-child(3) {
      padding-top: 0;
    }

    /* === GLOBAL ATMOSPHERIC OVERLAYS === */

    .scanlines::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(10, 14, 39, 0.04) 2px,
        rgba(10, 14, 39, 0.04) 4px
      );
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: multiply;
    }

    .grain::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
      z-index: 49;
    }

    .crt-glow::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(10, 14, 39, 0.25) 100%);
      pointer-events: none;
      z-index: 51;
    }

    .bg-grid {
      background-color: var(--dark-void);
      background-image:
        linear-gradient(rgba(94, 220, 244, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 220, 244, 0.07) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .bg-grid-pink {
      background-color: var(--neon-pink);
      background-image:
        linear-gradient(rgba(15, 27, 61, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 27, 61, 0.06) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .bg-grid-cyan {
      background-color: var(--neon-cyan);
      background-image:
        linear-gradient(rgba(15, 27, 61, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 27, 61, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .starfield {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .starfield .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--neon-cyan);
      opacity: 0.6;
      animation: twinkle 3s infinite ease-in-out;
    }

    .starfield .star:nth-child(2n) { background: var(--neon-yellow); }
    .starfield .star:nth-child(3n) { background: var(--neon-pink); }
    .starfield .star:nth-child(4n) { width: 6px; height: 6px; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }

    .pixel-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .pixel-particles .p {
      position: absolute;
      width: 8px;
      height: 8px;
      opacity: 0.4;
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(90deg); }
    }

    /* === PIXEL UI COMPONENTS === */

    .pixel-btn {
      display: inline-block;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 16px 36px;
      background: var(--neon-cyan);
      color: var(--deep-navy);
      border: none;
      cursor: pointer;
      position: relative;
      box-shadow:
        4px 0 0 0 var(--deep-navy),
        0 4px 0 0 var(--deep-navy),
        4px 4px 0 0 var(--deep-navy),
        8px 4px 0 0 var(--neon-yellow),
        4px 8px 0 0 var(--neon-yellow),
        8px 8px 0 0 var(--neon-yellow);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .pixel-btn:hover {
      transform: translate(2px, 2px);
      box-shadow:
        2px 0 0 0 var(--deep-navy),
        0 2px 0 0 var(--deep-navy),
        2px 2px 0 0 var(--deep-navy),
        4px 2px 0 0 var(--neon-yellow),
        2px 4px 0 0 var(--neon-yellow),
        4px 4px 0 0 var(--neon-yellow);
    }

    .pixel-btn.pink-btn {
      background: var(--neon-pink);
      box-shadow:
        4px 0 0 0 var(--deep-navy),
        0 4px 0 0 var(--deep-navy),
        4px 4px 0 0 var(--deep-navy),
        8px 4px 0 0 var(--neon-cyan),
        4px 8px 0 0 var(--neon-cyan),
        8px 8px 0 0 var(--neon-cyan);
    }

    .pixel-hero-text {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(3rem, 10vw, 8rem);
      line-height: 1.05;
      color: var(--neon-cyan);
      text-shadow:
        4px 4px 0 var(--neon-yellow),
        8px 8px 0 var(--deep-navy);
      letter-spacing: 0.04em;
    }

    .pixel-corners {
      position: relative;
    }

    .pixel-corners::before,
    .pixel-corners::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      border: 4px solid var(--neon-cyan);
    }

    .pixel-corners::before {
      top: -8px;
      left: -8px;
      border-right: none;
      border-bottom: none;
    }

    .pixel-corners::after {
      bottom: -8px;
      right: -8px;
      border-left: none;
      border-top: none;
    }

    .pixel-corners.yellow-corners::before,
    .pixel-corners.yellow-corners::after { border-color: var(--neon-yellow); }

    .pixel-corners.pink-corners::before,
    .pixel-corners.pink-corners::after { border-color: var(--neon-pink); }

    .pixel-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--neon-yellow);
      background: var(--deep-navy);
      padding: 6px 14px;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    /* === SLIDE CONTENT LAYOUTS === */

    .slide-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1400px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 1vw;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.15;
    }

    h1 { font-size: clamp(2rem, 5vw, 4rem); }
    h2 { font-size: clamp(1.5rem, 3.5vw, 2.8rem); }
    h3 { font-size: clamp(1.1rem, 2vw, 1.5rem); }
    p, li {
      font-family: var(--font-body);
      font-size: clamp(0.9rem, 1.2vw, 1.15rem);
      line-height: 1.7;
      font-weight: 400;
    }

    /* === NAVIGATION === */
    .nav-dots {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 100;
    }

    .nav-dot {
      width: 12px;
      height: 12px;
      border: 2px solid var(--neon-cyan);
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: all 0.3s;
    }

    .nav-dot::after {
      content: "";
      position: absolute;
      inset: 2px;
      background: var(--neon-cyan);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .nav-dot.active::after { opacity: 1; }
    .nav-dot:hover { border-color: var(--neon-yellow); }

    .slide-counter {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--neon-cyan);
      background: rgba(10, 14, 39, 0.8);
      padding: 8px 20px;
      z-index: 100;
      letter-spacing: 0.15em;
    }

    .nav-hint {
      position: fixed;
      bottom: 24px;
      right: 24px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--neon-cyan);
      opacity: 0.5;
      z-index: 100;
      letter-spacing: 0.1em;
    }

    /* === SLIDE 1: HERO === */
    .hero-subtitle {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      color: var(--neon-pink);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .hero-tagline {
      font-family: var(--font-body);
      font-size: clamp(0.9rem, 1.5vw, 1.2rem);
      color: rgba(255,255,255,0.7);
      max-width: 500px;
      text-align: center;
      margin-top: 2rem;
      line-height: 1.8;
    }

    .hero-badges {
      display: flex;
      gap: 16px;
      margin-top: 3rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hero-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 16px;
      border: 2px solid var(--neon-yellow);
      color: var(--neon-yellow);
    }

    /* === SLIDE 2: SPLIT INTRO === */
    .split-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4vw;
      align-items: center;
      width: 100%;
      max-width: 1100px;
    }

    @media (max-width: 768px) {
      .split-layout { grid-template-columns: 1fr; }
    }

    .pixel-avatar-zone {
      width: 100%;
      aspect-ratio: 1;
      max-width: 380px;
      margin: 0 auto;
      background: var(--deep-navy);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pixel-image-zone {
      width: 100%;
      max-width: 380px;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    .pixel-image-zone img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .pixel-avatar-zone::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 10px,
          rgba(94, 220, 244, 0.1) 10px,
          rgba(94, 220, 244, 0.1) 20px
        );
    }

    .pixel-face {
      width: 120px;
      height: 120px;
      position: relative;
    }

    .pixel-face .eye {
      position: absolute;
      width: 24px;
      height: 24px;
      background: var(--neon-cyan);
      top: 30px;
    }

    .pixel-face .eye.left { left: 16px; }
    .pixel-face .eye.right { right: 16px; }

    .pixel-face .mouth {
      position: absolute;
      width: 60px;
      height: 16px;
      background: var(--neon-pink);
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* === SLIDE 3: IMAGE SCROLLER === */
    .image-grid {
      display: flex;
      align-items: center;
      gap: clamp(10px, 2.5vw, 28px);
      width: calc(100% + 4vw);
      max-width: none;
      margin-left: -2vw;
      padding: 0 4px 24px;
      min-height: 320px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-inline: 4px;
      scrollbar-width: none;
    }

    .image-grid::-webkit-scrollbar {
      display: none;
    }

    .image-scrollbar {
      width: 10vw;
      min-width: 56px;
      max-width: 140px;
      height: 4px;
      margin: 2px auto 0;
      background: rgba(15, 27, 61, 0.18);
      border-radius: 2px;
      overflow: hidden;
    }

    .image-scrollbar-thumb {
      display: block;
      width: 33.333%;
      height: 100%;
      background: var(--deep-navy);
      border-radius: 2px;
      transform: translateX(0);
      transition: transform 0.1s linear;
    }

    .image-card {
      flex: 0 0 calc((100% - 2 * clamp(10px, 2.5vw, 28px)) / 3);
      min-width: 0;
      background: transparent;
      padding: 0;
      position: relative;
      border: none;
      overflow: hidden;
      border-radius: 18px;
      scroll-snap-align: start;
    }

    .image-card img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      object-fit: contain;
      border: none;
      background: transparent;
      border-radius: 18px;
    }

    @media (max-width: 600px) {
      .image-grid { min-height: 210px; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .starfield .star, .pixel-particles .p { animation: none; }
    }
  </style>
</head>
<body>

<div class="deck" id="deck">

  <div class="slides-container" id="slidesContainer">

    <!-- ========== SLIDE 1: HERO ========== -->
    <section class="slide bg-grid scanlines grain crt-glow" data-slide="1">
      <div class="starfield" id="starfield1"></div>
      <div class="pixel-particles" id="particles1"></div>
      <div class="slide-content" style="z-index:10;">
        <h1 class="pixel-hero-text" style="text-align:center;">8-BIT<br>ORBIT</h1>
        <p class="hero-tagline">Independent Game Developer, making cool games.</p>
      </div>
    </section>

    <!-- ========== SLIDE 2: SPLIT INTRO ========== -->
    <section class="slide bg-grid-pink scanlines grain" data-slide="2">
      <div class="slide-content">
        <div class="split-layout">
          <div class="pixel-image-zone pixel-corners yellow-corners">
            <img src="Assets/header.jpg" alt="From Scratch game artwork">
          </div>
          <div style="max-width: 460px;">
            <h2 style="color: var(--deep-navy); margin-bottom: 1.2rem; font-size: clamp(1.6rem, 3vw, 2.4rem);">From Scratch</h2>
            <p style="color: rgba(15,27,61,0.75); margin-bottom: 1rem;">
              From Scratch is a casual sandbox game where you can cut, fold, and paste cardboard to create any props you like. Choose from pre-made templates or design your own and start crafting!
            </p>
            
          </div>
        </div>
      </div>
    </section>

    <!-- ========== SLIDE 3: IMAGE GRID ========== -->
    <section class="slide bg-grid-pink scanlines grain" data-slide="3">
      <div class="slide-content">
        <div class="image-grid" aria-label="Scrollable image gallery">
          <div class="image-card">
            <img src="Assets/1.jpg" alt="">
          </div>
          <div class="image-card">
            <img src="Assets/2.jpg" alt="">
          </div>
          <div class="image-card">
            <img src="Assets/3.jpg" alt="">
          </div>
          <div class="image-card">
            <img src="Assets/4.jpg" alt="">
          </div>
          <div class="image-card">
            <img src="Assets/5.jpg" alt="">
          </div>
          <div class="image-card">
            <img src="Assets/6.jpg" alt="">
          </div>
        </div>
        <div class="image-scrollbar" aria-hidden="true">
          <span class="image-scrollbar-thumb"></span>
        </div>
      </div>
    </section>

  </div>
</div>

<script>
(function() {
  // ===== GENERATE STARFIELD =====
  function generateStars(containerId, count = 40) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      container.appendChild(star);
    }
  }

  generateStars('starfield1', 50);

  // ===== GENERATE FLOATING PARTICLES =====
  function generateParticles(containerId, colors, count = 12) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'p';
      const color = colors[i % colors.length];
      p.style.background = color;
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDelay = Math.random() * 5 + 's';
      p.style.animationDuration = (6 + Math.random() * 6) + 's';
      container.appendChild(p);
    }
  }

  generateParticles('particles1', ['var(--neon-cyan)', 'var(--neon-pink)', 'var(--neon-yellow)'], 16);

  // ===== IMAGE SCROLL INDICATOR =====
  const imageGrid = document.querySelector('.image-grid');
  const scrollbarThumb = document.querySelector('.image-scrollbar-thumb');

  function updateImageScrollbar() {
    if (!imageGrid || !scrollbarThumb) return;
    const scrollableWidth = imageGrid.scrollWidth - imageGrid.clientWidth;
    const progress = scrollableWidth > 0 ? imageGrid.scrollLeft / scrollableWidth : 0;
    scrollbarThumb.style.transform = `translateX(${progress * 200}%)`;
  }

  if (imageGrid) {
    imageGrid.addEventListener('scroll', updateImageScrollbar, { passive: true });
    window.addEventListener('resize', updateImageScrollbar);
    updateImageScrollbar();
  }

})();
</script>

</body>
</html>
